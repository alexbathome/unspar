name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # go.mod has `replace github.com/alexbathome/unsparse => ../unsparse`,
      # so the sibling repo must be checked out next to this one.
      - uses: actions/checkout@v4
        with:
          path: unspar
      - uses: actions/checkout@v4
        with:
          repository: alexbathome/unsparse
          path: unsparse
      - uses: actions/setup-go@v5
        with:
          go-version-file: unspar/go.mod
          cache-dependency-path: unspar/go.sum
      - name: Vet
        working-directory: unspar
        run: go vet ./...
      - name: Test
        working-directory: unspar
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: unspar
      - uses: actions/checkout@v4
        with:
          repository: alexbathome/unsparse
          path: unsparse
      - uses: actions/setup-go@v5
        with:
          go-version-file: unspar/go.mod
          cache-dependency-path: unspar/go.sum
      - name: gofmt
        working-directory: unspar
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
